[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhada"
version = "0.1.0"
description = "Legal compliance, SBOM generation, binary linkage verification, and security vulnerability auditor for Python source workspaces and compiled Nuitka/PyInstaller distributions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Rhada DevSecOps Team" }
]
keywords = [
    "rhada",
    "sbom",
    "compliance",
    "security",
    "vulnerability",
    "osv",
    "pip-audit",
    "cyclonedx",
    "spdx",
    "nuitka",
    "pyinstaller",
    "elf",
    "typer",
    "uv",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
    "Typing :: Typed",
]
dependencies = [
    "cvss>=3.6",
    "cyclonedx-python-lib>=11.12.0",
    "defusedxml>=0.7.1",
    "httpx>=0.27.0",
    "license-expression>=30.4.4",
    "packageurl-python>=0.17.6",
    "packaging>=24.0",
    "pip-audit>=2.10.1",
    "pyelftools>=0.31",
    "rich>=13.7.0",
    "typer>=0.27.3",
]

[project.scripts]
rhada = "rhada.cli:main"

[project.urls]
Homepage = "https://github.com/dcollison/rhada"
Repository = "https://github.com/dcollison/rhada"
Issues = "https://github.com/dcollison/rhada/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rhada"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "PERF",
    "FURB",
    "PIE",
    "BLE",
    "S",
]
ignore = [
    "E501",
    "S101",
    "S108",
]


